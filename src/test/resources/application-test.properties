spring.datasource.url=jdbc:h2:mem:roadguard-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

app.jwt.secret=test-only-secret-not-used-anywhere-real-0123456789abcdefghijklmnop
app.jwt.expiry-hours=1

app.admin.username=
app.admin.email=
app.admin.password=

app.ai.provider=stub
app.gemini.api-key=

app.dispatch.default-radius-km=5
app.dispatch.max-radius-km=25
app.dispatch.offer-count=3
app.dispatch.offer-timeout-sec=20
app.dispatch.max-attempts=3
app.dispatch.worker-threads=2
app.heartbeat.interval-sec=5
app.heartbeat.timeout-sec=15
app.tcp.port=0

app.uploads.dir=target/test-uploads

# bind an ephemeral port in tests so a running app does not clash
app.tcp.port=0
