<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RoadGuard - Driver</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/console.css" rel="stylesheet">
</head>
<body data-role="DRIVER" class="map-mode">

<header class="topbar">
    <div class="topbar-brand">
        <div class="wordmark">
            <span class="wordmark-badge">
                <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" class="rg-logo-svg">
                    <defs>
                        <linearGradient id="rgShieldDriver" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#FFBE1A"/>
                            <stop offset="55%" stop-color="#FF8A00"/>
                            <stop offset="100%" stop-color="#E65100"/>
                        </linearGradient>
                        <linearGradient id="rgRoadDriver" x1="16" y1="7" x2="16" y2="28" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#080E1C"/>
                            <stop offset="100%" stop-color="#141E36"/>
                        </linearGradient>
                        <linearGradient id="rgBevelDriver" x1="16" y1="2" x2="16" y2="30" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#FFF3B0" stop-opacity="0.85"/>
                            <stop offset="100%" stop-color="#FF9900" stop-opacity="0.1"/>
                        </linearGradient>
                    </defs>
                    <path d="M16 2.2L27.5 6.4C27.5 16.5 22.6 25.4 16 30C9.4 25.4 4.5 16.5 4.5 6.4L16 2.2Z" fill="url(#rgShieldDriver)"/>
                    <path d="M16 2.2L27.5 6.4C27.5 16.5 22.6 25.4 16 30C9.4 25.4 4.5 16.5 4.5 6.4L16 2.2Z" stroke="url(#rgBevelDriver)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16 5.8L24.2 8.8C24.2 16.2 20.6 23.2 16 26.8C11.4 23.2 7.8 16.2 7.8 8.8L16 5.8Z" fill="url(#rgRoadDriver)"/>
                    <polygon points="12,25.2 14.8,13.2 15.8,13.2 13.8,25.8" fill="rgba(255,255,255,0.22)"/>
                    <polygon points="20,25.2 17.2,13.2 16.2,13.2 18.2,25.8" fill="rgba(255,255,255,0.22)"/>
                    <line x1="16" y1="24.5" x2="16" y2="20" stroke="#FFC107" stroke-width="1.6" stroke-linecap="round"/>
                    <line x1="16" y1="17.5" x2="16" y2="14.5" stroke="#FFC107" stroke-width="1.3" stroke-linecap="round"/>
                    <path d="M16 7.5L16.9 10.1L19.5 11L16.9 11.9L16 14.5L15.1 11.9L12.5 11L15.1 10.1Z" fill="#FFFFFF"/>
                    <circle cx="16" cy="11" r="1.1" fill="#FFB800"/>
                </svg>
            </span>
            <span class="wordmark-title">Road<span class="brand-guard">Guard</span></span>
        </div>
        <span class="topbar-tag">Driver Portal</span>
    </div>

    <div class="topbar-center-status">
        <span class="live-status-dot"></span>
        <span class="live-status-text">Dispatch Network Active</span>
    </div>

    <div class="topbar-right">
        <div class="user-capsule" title="Logged in driver">
            <span class="avatar" id="avatar">·</span>
            <div class="user-meta">
                <span class="who-name" id="who-name">…</span>
                <span class="badge badge-driver"><span class="badge-status-dot"></span>DRIVER</span>
            </div>
        </div>
        <div class="topbar-divider"></div>
        <button class="btn-logout" id="logout-btn" type="button" title="Sign out of your session">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>Sign out</span>
        </button>
    </div>
</header>

<main class="map-stage">
    <div id="map"></div>
    <div class="map-panel" id="sos-panel"></div>
</main>

<div class="toast-stack" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="js/api.js"></script>
<script src="js/live.js"></script>
<script src="js/home.js"></script>
<script src="js/driver-map.js"></script>
<script src="js/sos-radar.js"></script>
<script src="js/driver-sos.js"></script>
</body>
</html>
