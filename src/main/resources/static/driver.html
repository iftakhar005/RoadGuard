<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RoadGuard - Driver</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body data-role="DRIVER" class="map-mode">

<header class="topbar">
    <div class="wordmark">
        <span class="wordmark-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="#1A1206" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2 4 6v6c0 5 3.4 8.6 8 10 4.6-1.4 8-5 8-10V6l-8-4z"/>
            </svg>
        </span>
        RoadGuard
    </div>
    <div class="topbar-right">
        <span class="avatar" id="avatar">·</span>
        <span class="who-name" id="who-name">…</span>
        <span class="badge">DRIVER</span>
        <button class="btn btn-ghost" id="logout-btn">Sign out</button>
    </div>
</header>

<main class="map-stage">
    <div id="map"></div>

    <div class="map-panel">
        <h1>Where are you?</h1>
        <p class="map-panel-sub">Drag the pin to exactly where your vehicle has broken down.</p>

        <div class="coords">
            <span class="coords-label">Your location</span>
            <span class="coords-val" id="coords">getting your position…</span>
        </div>

        <div class="map-panel-actions">
            <button class="btn btn-sos" disabled title="Coming in the next update">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 9v4M12 17h.01"/>
                    <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
                </svg>
                Send SOS
            </button>
            <button class="btn btn-locate" id="locate-btn" type="button" title="Recentre on me">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
                </svg>
                Recentre
            </button>
        </div>

        <p class="map-panel-note">The SOS button is next - it will broadcast this location to nearby mechanics.</p>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/api.js"></script>
<script src="js/home.js"></script>
<script src="js/driver-map.js"></script>
</body>
</html>
