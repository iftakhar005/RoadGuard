<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RoadGuard - Driver</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body data-role="DRIVER">

<div class="topbar">
    <strong>RoadGuard</strong>
    <div class="d-flex align-items-center gap-3">
        <span class="who" id="who">...</span>
        <button class="btn btn-sm btn-outline-secondary" id="logout-btn">Sign out</button>
    </div>
</div>

<div class="page">
    <div class="panel">
        <h5 class="mb-1">Driver</h5>
        <p class="text-muted small mb-4">You are signed in. The details below came back from a
            protected API call, not from this browser.</p>

        <div id="session-details"></div>

        <hr class="my-4">

        <h6 class="mb-2">Coming next</h6>
        <ul class="text-muted small mb-0">
            <li>Map with a pin for where you have broken down</li>
            <li>SOS button - issue type, note, optional photo</li>
            <li>Live status as a mechanic is found and starts heading over</li>
        </ul>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/home.js"></script>
</body>
</html>
