<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RoadGuard - Job Replay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/console.css" rel="stylesheet">
    <style>
        .replay-shell {
            display: flex;
            height: calc(100vh - 64px);
            position: relative;
            overflow: hidden;
        }
        .replay-map {
            flex: 1;
            height: 100%;
            z-index: 1;
        }
        .replay-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 360px;
            max-width: calc(100vw - 40px);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }
        .replay-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .replay-title {
            font-size: 1.1rem;
            font-weight: 650;
            color: #0f172a;
            margin: 0;
        }
        .replay-status-badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: #e2e8f0;
            color: #475569;
        }
        .replay-status-badge.status-accepted { background: #dbeafe; color: #1e40af; }
        .replay-status-badge.status-en_route { background: #fef3c7; color: #92400e; }
        .replay-status-badge.status-arrived { background: #e0e7ff; color: #3730a3; }
        .replay-status-badge.status-in_progress { background: #fce7f3; color: #9d174d; }
        .replay-status-badge.status-completed { background: #dcfce7; color: #166534; }
        .replay-status-badge.status-cancelled { background: #fee2e2; color: #991b1b; }
        .replay-meta {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 16px;
            line-height: 1.4;
        }
        .replay-meta strong {
            color: #334155;
        }
        .replay-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }
        .replay-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .replay-btn:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .replay-btn.is-active {
            background: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }
        .speed-group {
            display: flex;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            overflow: hidden;
            margin-left: auto;
        }
        .speed-btn {
            padding: 6px 10px;
            font-size: 0.78rem;
            font-weight: 600;
            background: #ffffff;
            border: none;
            border-right: 1px solid #cbd5e1;
            cursor: pointer;
            color: #64748b;
        }
        .speed-btn:last-child {
            border-right: none;
        }
        .speed-btn.is-active {
            background: #0f172a;
            color: #ffffff;
        }
        .replay-scrubber {
            width: 100%;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .replay-time {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #94a3b8;
            font-variant-numeric: tabular-nums;
        }
        .replay-event-box {
            margin-top: 14px;
            padding: 10px 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.82rem;
            color: #475569;
        }
        .replay-event-announcement {
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 2px;
        }
    </style>
</head>
<body class="map-mode">

<header class="topbar">
    <div class="topbar-brand">
        <div class="wordmark">
            <span class="wordmark-badge">
                <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" class="rg-logo-svg">
                    <defs>
                        <linearGradient id="rgShieldReplay" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#FFBE1A"/>
                            <stop offset="55%" stop-color="#FF8A00"/>
                            <stop offset="100%" stop-color="#E65100"/>
                        </linearGradient>
                        <linearGradient id="rgRoadReplay" x1="16" y1="7" x2="16" y2="28" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#080E1C"/>
                            <stop offset="100%" stop-color="#141E36"/>
                        </linearGradient>
                        <linearGradient id="rgBevelReplay" x1="16" y1="2" x2="16" y2="30" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#FFF3B0" stop-opacity="0.85"/>
                            <stop offset="100%" stop-color="#FF9900" stop-opacity="0.1"/>
                        </linearGradient>
                    </defs>
                    <path d="M16 2.2L27.5 6.4C27.5 16.5 22.6 25.4 16 30C9.4 25.4 4.5 16.5 4.5 6.4L16 2.2Z" fill="url(#rgShieldReplay)"/>
                    <path d="M16 2.2L27.5 6.4C27.5 16.5 22.6 25.4 16 30C9.4 25.4 4.5 16.5 4.5 6.4L16 2.2Z" stroke="url(#rgBevelReplay)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16 5.8L24.2 8.8C24.2 16.2 20.6 23.2 16 26.8C11.4 23.2 7.8 16.2 7.8 8.8L16 5.8Z" fill="url(#rgRoadReplay)"/>
                    <polygon points="12,25.2 14.8,13.2 15.8,13.2 13.8,25.8" fill="rgba(255,255,255,0.22)"/>
                    <polygon points="20,25.2 17.2,13.2 16.2,13.2 18.2,25.8" fill="rgba(255,255,255,0.22)"/>
                    <line x1="16" y1="24.5" x2="16" y2="20" stroke="#FFC107" stroke-width="1.6" stroke-linecap="round"/>
                    <line x1="16" y1="17.5" x2="16" y2="14.5" stroke="#FFC107" stroke-width="1.3" stroke-linecap="round"/>
                    <path d="M16 7.5L16.9 10.1L19.5 11L16.9 11.9L16 14.5L15.1 11.9L12.5 11L15.1 10.1Z" fill="#FFFFFF"/>
                    <circle cx="16" cy="11" r="1.1" fill="#FFB800"/>
                </svg>
            </span>
            <span class="wordmark-title">Road<span class="brand-guard">Guard</span></span>
        </div>
        <span class="topbar-tag">Incident Replay</span>
    </div>

    <div class="topbar-center-status">
        <span class="live-status-dot" style="background:#3b82f6;"></span>
        <span class="live-status-text">Recorded Timeline</span>
    </div>

    <div class="topbar-right">
        <button class="btn btn-locate" onclick="window.history.back()" type="button">
            &larr; Back
        </button>
    </div>
</header>

<div class="replay-shell">
    <div id="replay-map" class="replay-map"></div>

    <div class="replay-panel" id="replay-panel">
        <div class="replay-head">
            <h1 class="replay-title" id="replay-title">Loading replay...</h1>
            <span class="replay-status-badge" id="replay-badge">--</span>
        </div>

        <div class="replay-meta" id="replay-meta">
            Please wait while the timeline is loaded.
        </div>

        <div class="replay-controls">
            <button class="replay-btn" id="btn-play">Play</button>
            <button class="replay-btn" id="btn-restart">Restart</button>
            <div class="speed-group">
                <button class="speed-btn is-active" data-speed="1">1x</button>
                <button class="speed-btn" data-speed="4">4x</button>
                <button class="speed-btn" data-speed="16">16x</button>
            </div>
        </div>

        <input type="range" class="replay-scrubber" id="replay-scrubber" min="0" max="0" value="0" step="1">

        <div class="replay-time">
            <span id="time-current">00:00</span>
            <span id="time-total">00:00</span>
        </div>

        <div class="replay-event-box" id="replay-event-box">
            <div class="replay-event-announcement" id="event-announcement">Ready to play</div>
            <div id="event-detail">Press Play to begin route and status replay.</div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/api.js"></script>
<script src="js/replay.js"></script>
</body>
</html>
