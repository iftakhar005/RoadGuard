<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RoadGuard - Sign in</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="auth-wrap">
    <div class="auth-card">

        <div class="brand">
            <div class="brand-mark">&#128736;</div>
            <h1>RoadGuard</h1>
            <p>Roadside help, dispatched in seconds</p>
        </div>

        <ul class="nav nav-pills nav-fill mb-4" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#login-pane" type="button">
                    Sign in
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#register-pane" type="button">
                    Create account
                </button>
            </li>
        </ul>

        <!-- shown for both forms -->
        <div id="alert" class="alert d-none" role="alert"></div>

        <div class="tab-content">

            <!-- ---------- sign in ---------- -->
            <div class="tab-pane fade show active" id="login-pane">
                <form id="login-form" novalidate>
                    <div class="mb-3">
                        <label class="form-label" for="login-username">Username</label>
                        <input class="form-control" id="login-username" autocomplete="username" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="login-password">Password</label>
                        <input class="form-control" id="login-password" type="password"
                               autocomplete="current-password" required>
                    </div>
                    <button class="btn btn-brand w-100" type="submit" id="login-btn">Sign in</button>
                </form>
            </div>

            <!-- ---------- register ---------- -->
            <div class="tab-pane fade" id="register-pane">
                <form id="register-form" novalidate>

                    <div class="mb-3">
                        <label class="form-label">I am a</label>
                        <div class="role-picker">
                            <label class="role-option">
                                <input type="radio" name="role" value="DRIVER" checked>
                                <span>Driver</span>
                            </label>
                            <label class="role-option">
                                <input type="radio" name="role" value="MECHANIC">
                                <span>Mechanic</span>
                            </label>
                            <label class="role-option">
                                <input type="radio" name="role" value="ADMIN">
                                <span>Admin</span>
                            </label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="reg-username">Username</label>
                        <input class="form-control" id="reg-username" minlength="3" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="reg-email">Email</label>
                        <input class="form-control" id="reg-email" type="email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="reg-password">Password</label>
                        <input class="form-control" id="reg-password" type="password" minlength="6" required>
                        <div class="form-text">At least 6 characters.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="reg-phone">Phone <span class="text-muted">(optional)</span></label>
                        <input class="form-control" id="reg-phone">
                    </div>

                    <!-- only makes sense for a mechanic, so it appears when that
                         role is picked -->
                    <div class="mb-4 d-none" id="skills-group">
                        <label class="form-label">What can you fix?</label>
                        <div class="skills-box">
                            <div class="row g-2" id="skills-list"></div>
                            <div class="form-text mt-2">Leave empty to be listed as a general mechanic.</div>
                        </div>
                    </div>

                    <button class="btn btn-brand w-100" type="submit" id="register-btn">Create account</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth-page.js"></script>
</body>
</html>
