<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RoadGuard - Mechanic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/console.css" rel="stylesheet">
</head>
<body data-role="MECHANIC">

<header class="topbar">
    <div class="topbar-brand">
        <div class="wordmark">
            <span class="wordmark-badge">
                <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" class="rg-logo-svg">
                    <defs>
                        <linearGradient id="rgShieldMech" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#FFBE1A"/>
                            <stop offset="55%" stop-color="#FF8A00"/>
                            <stop offset="100%" stop-color="#E65100"/>
                        </linearGradient>
                        <linearGradient id="rgRoadMech" x1="16" y1="7" x2="16" y2="28" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#080E1C"/>
                            <stop offset="100%" stop-color="#141E36"/>
                        </linearGradient>
                        <linearGradient id="rgBevelMech" x1="16" y1="2" x2="16" y2="30" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#FFF3B0" stop-opacity="0.85"/>
                            <stop offset="100%" stop-color="#FF9900" stop-opacity="0.1"/>
                        </linearGradient>
                    </defs>
                    <path d="M16 2.2L27.5 6.4C27.5 16.5 22.6 25.4 16 30C9.4 25.4 4.5 16.5 4.5 6.4L16 2.2Z" fill="url(#rgShieldMech)"/>
                    <path d="M16 2.2L27.5 6.4C27.5 16.5 22.6 25.4 16 30C9.4 25.4 4.5 16.5 4.5 6.4L16 2.2Z" stroke="url(#rgBevelMech)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16 5.8L24.2 8.8C24.2 16.2 20.6 23.2 16 26.8C11.4 23.2 7.8 16.2 7.8 8.8L16 5.8Z" fill="url(#rgRoadMech)"/>
                    <polygon points="12,25.2 14.8,13.2 15.8,13.2 13.8,25.8" fill="rgba(255,255,255,0.22)"/>
                    <polygon points="20,25.2 17.2,13.2 16.2,13.2 18.2,25.8" fill="rgba(255,255,255,0.22)"/>
                    <line x1="16" y1="24.5" x2="16" y2="20" stroke="#FFC107" stroke-width="1.6" stroke-linecap="round"/>
                    <line x1="16" y1="17.5" x2="16" y2="14.5" stroke="#FFC107" stroke-width="1.3" stroke-linecap="round"/>
                    <path d="M16 7.5L16.9 10.1L19.5 11L16.9 11.9L16 14.5L15.1 11.9L12.5 11L15.1 10.1Z" fill="#FFFFFF"/>
                    <circle cx="16" cy="11" r="1.1" fill="#FFB800"/>
                </svg>
            </span>
            <span class="wordmark-title">Road<span class="brand-guard">Guard</span></span>
        </div>
        <span class="topbar-tag">Mechanic Console</span>
    </div>

    <div class="topbar-center-status">
        <span class="live-status-dot"></span>
        <span class="live-status-text">Available for Dispatch</span>
    </div>

    <div class="topbar-right">
        <div class="user-capsule" title="Logged in mechanic">
            <span class="avatar" id="avatar">·</span>
            <div class="user-meta">
                <span class="who-name" id="who-name">…</span>
                <span class="badge badge-mechanic"><span class="badge-status-dot"></span>MECHANIC</span>
            </div>
        </div>
        <div class="topbar-divider"></div>
        <button class="btn-logout" id="logout-btn" type="button" title="Sign out of your session">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>Sign out</span>
        </button>
    </div>
</header>

<div class="console-shell">
    <div class="console">

        <div class="console-head">
            <div>
                <h1>Mechanic console</h1>
                <p>Go on duty to start receiving breakdowns near you.</p>
            </div>
        </div>

        <section class="card duty" id="duty-card">
            <div class="duty-state">
                <span class="duty-orb">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 5.5a4 4 0 0 0 5 5L21 9v6a2 2 0 0 1-2 2h-6l-4.6 4.6a2 2 0 0 1-2.8-2.8L10 14"/>
                        <path d="M3 3l6 6"/>
                    </svg>
                </span>
                <div class="duty-text">
                    <strong id="duty-title">Off duty</strong>
                    <span id="duty-sub">Go on duty to start receiving jobs.</span>
                    <div class="duty-skills" id="duty-skills"></div>
                </div>
            </div>

            <label class="switch">
                <input type="checkbox" id="duty-toggle">
                <span class="switch-track"></span>
                <span class="switch-label" id="duty-toggle-label">Off duty</span>
            </label>
        </section>

        <div id="job-wrap" style="display:none"></div>

        <div>
            <p class="section-label">
                Incoming jobs
                <span class="count-pill" id="offer-count" style="display:none">0</span>
            </p>
            <div class="offer-list" id="offer-list"></div>
        </div>

    </div>
</div>

<div class="toast-stack" id="toasts"></div>

<script src="js/api.js"></script>
<script src="js/home.js"></script>
<script src="js/mechanic-console.js"></script>
</body>
</html>
