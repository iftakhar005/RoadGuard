spring.application.name=roadguard
server.port=8080

# Secrets and any MySQL overrides live in application-local.properties (git-ignored).
# See application-local.properties.example.
spring.profiles.active=local

# --- Datasource: H2 file mode for dev (identical JPA code to MySQL, per spec 2) ---
spring.datasource.url=jdbc:h2:file:./data/roadguard;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Photo upload for AI triage (spec 10.1) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Dispatch tuning (spec 18) ---
app.dispatch.default-radius-km=5
app.dispatch.max-radius-km=25
app.dispatch.offer-count=3
app.dispatch.offer-timeout-sec=20
app.dispatch.max-attempts=3
app.dispatch.worker-threads=4

# --- Heartbeat reaper (spec 6.5) ---
app.heartbeat.interval-sec=5
app.heartbeat.timeout-sec=15

# --- Raw TCP device gateway (spec 10.3) ---
app.tcp.port=9090

# --- AI triage (spec 8): 'stub' until a Gemini key is available ---
app.ai.provider=stub
app.gemini.model=gemini-2.5-flash
