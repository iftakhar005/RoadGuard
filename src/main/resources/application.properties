spring.application.name=roadguard
server.port=8080

# Secrets live in application-local.properties, which is git-ignored.
# Copy application-local.properties.example to get started.
spring.profiles.active=local

# --- Database ---
# H2 in file mode for development. Swapping to MySQL for the demo is just a
# matter of overriding these in application-local.properties - the JPA code
# does not change.
spring.datasource.url=jdbc:h2:file:./data/roadguard;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Photo upload for the AI fault check ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Dispatch tuning ---
# How far to look, how many mechanics to offer to, and how long to wait
# before widening the search.
app.dispatch.default-radius-km=5
app.dispatch.max-radius-km=25
app.dispatch.offer-count=3
app.dispatch.offer-timeout-sec=20
app.dispatch.max-attempts=3
app.dispatch.worker-threads=4

# --- Heartbeats ---
# Mechanics ping this often; miss the timeout and we mark them offline
# and re-dispatch whatever they were working on.
app.heartbeat.interval-sec=5
app.heartbeat.timeout-sec=15

# --- Raw TCP gateway for the mechanic devices / fleet simulator ---
app.tcp.port=9090

# --- AI fault triage ---
# Stays on 'stub' until we have a Gemini key.
app.ai.provider=stub
app.gemini.model=gemini-2.5-flash

# where uploaded shop pictures are stored
app.uploads.dir=uploads
